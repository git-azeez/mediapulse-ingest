services:
  main:
    command: [ "sleep", "infinity" ]
    user: "10001:10001"
    depends_on:
      runtime-setup:
        condition: service_completed_successfully
      floci-gcp:
        condition: service_started
      gcp-gateway:
        condition: service_started
    environment:
      HTTP_PROXY: http://172.20.0.1:18080
      http_proxy: http://172.20.0.1:18080
      HTTPS_PROXY: http://172.20.0.1:18080
      https_proxy: http://172.20.0.1:18080
      NO_PROXY: localhost,127.0.0.1,::1,runtime-setup,floci-gcp,gcp-gateway,gcp,floci
      no_proxy: localhost,127.0.0.1,::1,runtime-setup,floci-gcp,gcp-gateway,gcp,floci
      CURL_CA_BUNDLE: /etc/daytona-netleash-ca.crt
      SSL_CERT_FILE: /etc/daytona-netleash-ca.crt
      REQUESTS_CA_BUNDLE: /etc/daytona-netleash-ca.crt
      NODE_EXTRA_CA_CERTS: /etc/daytona-netleash-ca.crt
      GCE_METADATA_HOST: "127.0.0.1:1"
      GCE_METADATA_ROOT: "127.0.0.1:1"
      NO_GCE_CHECK: "true"
      GCP_ENDPOINT_URL: http://gcp:4588
      PUBSUB_EMULATOR_HOST: gcp:4588
      FIRESTORE_EMULATOR_HOST: gcp:4588
      DATASTORE_EMULATOR_HOST: gcp:4588
      STORAGE_EMULATOR_HOST: http://gcp:4588
      SECRET_MANAGER_EMULATOR_HOST: gcp:4588
      FIREBASE_AUTH_EMULATOR_HOST: gcp:4588
    networks:
      - solver-control
      - agent
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - DAC_READ_SEARCH
    volumes:
      - config:/workspace/config:ro
      - /etc/daytona/netleash/ca.crt:/etc/daytona-netleash-ca.crt:ro

  runtime-setup:
    build:
      context: ./application
      target: runtime-setup
    command: [ "/bin/sh", "/runtime.sh" ]
    depends_on:
      gcp-gateway:
        condition: service_started
    environment:
      DOCKER_BUILDKIT: "1"
    networks:
      - solver-control
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runtime.sh:/runtime.sh:ro
      - config:/config

  floci-gcp:
    image: floci/floci-gcp:latest@sha256:ea29a53b34d04ba05240cdc6833608e43ae2b0a67849e5b97f01a7224e1138ea
    pull_policy: missing
    environment:
      FLOCI_GCP_PORT: "4589"
      FLOCI_GCP_HOSTNAME: gcp
      FLOCI_GCP_BASE_URL: http://gcp:4588
      FLOCI_GCP_STORAGE_MODE: persistent
      FLOCI_GCP_STORAGE_PERSISTENT_PATH: /app/data
      FLOCI_GCP_SERVICES_CLOUDRUN_MOCK: "true"
      FLOCI_GCP_SERVICES_CLOUDSQL_MOCK: "true"
      FLOCI_GCP_DNS_CONTAINER_FALLBACK_ENABLED: "false"
      FLOCI_DOCKER_DOCKER_HOST: unix:///var/run/docker.sock
      FLOCI_DOCKER_RESOURCE_NAMESPACE: ${COMPOSE_PROJECT_NAME}
      FLOCI_SERVICES_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME}_workload
    networks:
      solver-control:
        aliases: [ gcp, floci-gcp, floci ]
      workload:
        aliases: [ gcp, floci-gcp, floci ]
    restart: unless-stopped
    volumes:
      - floci-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock

  gcp-gateway:
    build:
      context: .
      target: toolchain
    network_mode: "service:floci-gcp"
    depends_on:
      floci-gcp:
        condition: service_started
    command: [ "python3", "/gcp_gateway.py" ]
    environment:
      FLOCI_BACKEND_URL: http://127.0.0.1:4589
      GATEWAY_PORT: "4588"
      PG_PORT: "5432"
      GATEWAY_DATA_DIR: /app/data
    restart: unless-stopped
    volumes:
      - floci-data:/app/data
      - ./gcp_gateway.py:/gcp_gateway.py:ro

networks:
  agent: {}
  solver-control:
    internal: true
  workload:
    name: ${COMPOSE_PROJECT_NAME}_workload
    internal: true

volumes:
  floci-data: {}
  config: {}
