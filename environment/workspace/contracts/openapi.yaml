openapi: 3.1.0
info:
  title: MediaPulse Ingest API
  version: 1.0.0
  description: >-
    The supplied API image implements this contract for MediaPulse Ingest on Google Cloud Platform
    and must be deployed without modification. All projection and audit paths are asynchronous
    after Cloud SQL PostgreSQL command and transactional outbox commit.
servers:
  - url: http://{loadBalancerEndpoint}
    variables:
      loadBalancerEndpoint:
        default: localhost
tags:
  - name: health
  - name: media
  - name: admin
paths:
  /health/live:
    get:
      tags: [health]
      operationId: live
      security: []
      responses:
        "200":
          description: Process is live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      tags: [health]
      operationId: ready
      security: []
      responses:
        "200":
          description: >-
            Critical Cloud SQL for PostgreSQL and Cloud Firestore stores are reachable. Cloud Pub/Sub
            and Cloud Datastore status is also reported, while documented outbox and cache fallback
            paths keep the API ready during transient broker or cache disruptions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: At least one critical dependency is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/media:
    post:
      tags: [media]
      operationId: createMedia
      security:
        - identityPlatform: [mediapulse/write]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMedia"
      responses:
        "201":
          description: New media ingestion command committed durably.
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        "200":
          description: Idempotent replay of a previously committed command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/media/{id}/checkpoints:
    post:
      tags: [media]
      operationId: recordCheckpoint
      security:
        - identityPlatform: [mediapulse/write]
      parameters:
        - $ref: "#/components/parameters/MediaId"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordCheckpoint"
      responses:
        "202":
          description: Checkpoint command committed; Firestore projection is asynchronous.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        "200":
          description: Idempotent replay of a previously committed command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /v1/media/{id}:
    get:
      tags: [media]
      operationId: getMedia
      security:
        - identityPlatform: [mediapulse/read]
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Current projected media state from Cloud Firestore or Cloud Datastore cache.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Cache:
              $ref: "#/components/headers/CacheStatus"
            X-MediaPulse-Source:
              $ref: "#/components/headers/DataSource"
            X-MediaPulse-Version:
              $ref: "#/components/headers/ProjectionVersion"
            X-MediaPulse-Instance:
              $ref: "#/components/headers/Instance"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaProjection"
        "304":
          description: Entity state has not changed for the supplied If-None-Match ETag.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/media/{id}/timeline:
    get:
      tags: [media]
      operationId: getMediaTimeline
      security:
        - identityPlatform: [mediapulse/read]
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "200":
          description: Projected events sorted by aggregateVersion.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Cache:
              $ref: "#/components/headers/CacheStatus"
            X-MediaPulse-Source:
              $ref: "#/components/headers/DataSource"
            X-MediaPulse-Version:
              $ref: "#/components/headers/ProjectionVersion"
            X-MediaPulse-Instance:
              $ref: "#/components/headers/Instance"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Timeline"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/admin/projections/{id}/rebuild:
    post:
      tags: [admin]
      operationId: rebuildProjection
      security:
        - identityPlatform: [mediapulse/admin]
      parameters:
        - $ref: "#/components/parameters/MediaId"
      responses:
        "202":
          description: All persisted aggregate events were requeued in version order via Cloud Tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebuildResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    identityPlatform:
      type: oauth2
      description: >-
        JWT tokens are issued by the Google Cloud Identity Platform tenant created for this deployment.
        Scoped service identities enforce read, write, and admin permissions.
      flows:
        clientCredentials:
          tokenUrl: /identitytoolkit/v3/token
          scopes:
            mediapulse/read: Read Firestore projections and media timelines.
            mediapulse/write: Register media assets and record processing checkpoints.
            mediapulse/admin: Requeue persisted events for projection rebuild via Cloud Tasks.
  parameters:
    MediaId:
      name: id
      in: path
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 200
  headers:
    CorrelationId:
      description: Caller-provided or generated correlation identifier.
      schema:
        type: string
    ETag:
      description: Version-aware entity tag for conditional GET caching.
      schema:
        type: string
    CacheStatus:
      description: Whether the read hit Cloud Datastore entity cache or missed to Cloud Firestore.
      schema:
        enum: [HIT, MISS]
    DataSource:
      description: System that satisfied this read.
      schema:
        enum: [projection, cache]
    ProjectionVersion:
      description: Aggregate version returned by the read model.
      schema:
        type: integer
        minimum: 1
    Instance:
      description: Cloud Run revision instance identifier that handled this request.
      schema:
        type: string
  responses:
    BadRequest:
      description: Request or required header is invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Bearer token is absent, malformed, expired, or untrusted.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Authenticated token lacks the required route scope.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Aggregate or its asynchronous projection does not exist yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Aggregate version or idempotency ownership conflict.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Required cloud dependency is temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    CreateMedia:
      type: object
      required: [mediaId, ownerId, reference, origin, destination, expectedVersion]
      properties:
        mediaId:
          type: string
        ownerId:
          type: string
          minLength: 1
          maxLength: 128
        reference:
          type: string
          minLength: 1
          maxLength: 128
        origin:
          type: string
          minLength: 1
          maxLength: 256
        destination:
          type: string
          minLength: 1
          maxLength: 256
        expectedVersion:
          const: 0
    RecordCheckpoint:
      type: object
      required: [checkpointId, status, location, occurredAt, expectedVersion]
      properties:
        checkpointId:
          type: string
        status:
          $ref: "#/components/schemas/CheckpointStatus"
        location:
          type: string
          minLength: 1
          maxLength: 256
        note:
          type: string
          maxLength: 1000
        occurredAt:
          type: string
          format: date-time
        expectedVersion:
          type: integer
          minimum: 1
    MutationResult:
      type: object
      required: [mediaId, eventId, version, accepted, idempotentReplay]
      properties:
        mediaId:
          type: string
        eventId:
          type: string
        version:
          type: integer
          minimum: 1
        accepted:
          const: true
        idempotentReplay:
          type: boolean
    MediaProjection:
      type: object
      required: [mediaId, ownerId, reference, origin, destination, status, version, updatedAt]
      properties:
        mediaId:
          type: string
        ownerId:
          type: string
        reference:
          type: string
        origin:
          type: string
        destination:
          type: string
        status:
          $ref: "#/components/schemas/MediaStatus"
        version:
          type: integer
          minimum: 1
        updatedAt:
          type: string
          format: date-time
    Timeline:
      type: object
      required: [mediaId, version, events]
      properties:
        mediaId:
          type: string
        version:
          type: integer
          minimum: 1
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/EventEnvelope"
    EventEnvelope:
      type: object
      required:
        [schemaVersion, eventId, eventType, aggregateId, aggregateVersion, ownerId, occurredAt, correlationId, data]
      properties:
        schemaVersion:
          const: "1.0"
        eventId:
          type: string
        eventType:
          enum: [MediaRegistered, CheckpointRecorded]
        aggregateId:
          type: string
        aggregateVersion:
          type: integer
          minimum: 1
        ownerId:
          type: string
        occurredAt:
          type: string
          format: date-time
        correlationId:
          type: string
        data:
          oneOf:
            - $ref: "#/components/schemas/MediaRegisteredData"
            - $ref: "#/components/schemas/CheckpointRecordedData"
    MediaRegisteredData:
      type: object
      required: [kind, reference, origin, destination]
      properties:
        kind:
          const: mediaRegistered
        reference:
          type: string
        origin:
          type: string
        destination:
          type: string
    CheckpointRecordedData:
      type: object
      required: [kind, checkpointId, status, location]
      properties:
        kind:
          const: checkpointRecorded
        checkpointId:
          type: string
        status:
          $ref: "#/components/schemas/CheckpointStatus"
        location:
          type: string
        note:
          type: string
    CheckpointStatus:
      enum: [INGESTED, TRANSCODING, PACKAGED, QC_PASSED, PUBLISHED, EXCEPTION]
    MediaStatus:
      enum: [REGISTERED, INGESTED, TRANSCODING, PACKAGED, QC_PASSED, PUBLISHED, EXCEPTION]
    RebuildResult:
      type: object
      required: [mediaId, requeued]
      properties:
        mediaId:
          type: string
        requeued:
          type: integer
          minimum: 1
    Health:
      type: object
      required: [status, service, instance, checks]
      properties:
        status:
          enum: [UP, DOWN]
        service:
          const: mediapulse-api
        instance:
          type: string
        checks:
          type: object
          additionalProperties:
            enum: [UP, DOWN]
    Error:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
        message:
          type: string
